let st={},view=[],pos=0,fin=false,ord={},arm=0;
try{st=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){st={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const S=i=>st[D[i].n]||(st[D[i].n]={s:[],d:0});
const multi=i=>D[i].t==="CM"||D[i].a.length>1;
const test=()=>$("tst").checked;
const ok=i=>{const s=S(i).s,a=D[i].a;return s.length===a.length&&a.every(x=>s.includes(x))};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const reveal=i=>S(i).d&&(!test()||fin);
const locked=i=>fin||(!test()&&S(i).d);
function order(i){if(!ord[i]){const k=D[i].o.map((_,j)=>j);if($("sho").checked)shuffle(k);ord[i]=k}return ord[i]}
function filt(sh){
 const t=$("typ").value,f=$("sta").value;
 view=D.map((_,i)=>i).filter(i=>{
  if(t&&D[i].t!==t)return false;
  if(f==="n")return !S(i).d;if(f==="w")return S(i).d&&!ok(i);if(f==="c")return S(i).d&&ok(i);if(f==="i")return !!D[i].i;
  return true});
 if(sh)shuffle(view);pos=0;render()}
function render(){
 const g=$("grid");g.innerHTML="";
 view.forEach((i,p)=>{const b=document.createElement("button");b.textContent=D[i].n;
  if(p===pos)b.className="cur";
  if(S(i).d){if(reveal(i))b.classList.add(ok(i)?"g":"r");else b.classList.add("s")}
  b.onclick=()=>{pos=p;render();window.scrollTo({top:0,behavior:"smooth"})};g.appendChild(b)});
 const c=$("card");
 if(!view.length){c.textContent="Nicio întrebare pentru filtrul ales.";$("chk").disabled=$("prev").disabled=$("next").disabled=true;stats();return}
 const i=view[pos],Q=D[i],s=S(i),m=multi(i),lk=locked(i),rv=reveal(i),o=order(i);
 let h=`<div class="meta">Întrebarea ${Q.n} · ${m?"CM · mai multe răspunsuri corecte":"CS · un singur răspuns corect"} · ${pos+1}/${view.length}</div>`;
 h+=`<div class="q">${Q.q}</div>`;
 if(Q.i)h+=`<img src="${IM[Q.i]}" style="width:${Q.w}px" alt="Imagine la întrebarea ${Q.n}" id="qi">`;
 o.forEach((k,x)=>{const on=s.s.includes(k),right=Q.a.includes(k);let cls="o";
  if(rv){if(on&&right)cls+=" ok";else if(on)cls+=" no";else if(right)cls+=" miss"}
  h+=`<label class="${cls}"><input type="${m?"checkbox":"radio"}" name="o" ${on?"checked":""} ${lk?"disabled":""} data-k="${k}"><span><b>${"abcdefgh"[x]})</b> ${Q.o[k]}</span></label>`});
 if(rv){const r=ok(i),ls=Q.a.map(k=>o.indexOf(k)).sort().map(x=>"abcdefgh"[x]);

 else if(s.d&&test())h+=`<div class="note">Răspuns salvat. Îl poți modifica până termini testul.</div>`;

function stats(){
 const dn=D.filter((_,i)=>S(i).d).length;let t=`${dn}/${D.length} răspunse`;
 if(!test()||fin){const r=D.filter((_,i)=>S(i).d&&ok(i)).length;t=`Corecte: ${r}/${dn} răspunse · ${t}`;
  if(fin)t=`TEST TERMINAT · Scor: ${r}/${D.length} (${Math.round(r/D.length*100)}%) · fără răspuns: ${D.length-dn}`}

$("typ").onchange=()=>filt();$("sta").onchange=()=>filt();
$("sho").onchange=()=>{ord={};render()};
$("tst").onchange=()=>{fin=false;render()};
$("lb").onclick=()=>{$("lb").style.display="none"};
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")$("next").click();if(e.key==="ArrowLeft")$("prev").click();if(e.key==="Enter")$("chk").click();if(e.key==="Escape")$("lb").click()});

const L2="abcdefgh";let TQ=[],TA={},tp=0,td=false,tf="",tarm=0;
function scr(s){["home","app","test"].forEach(x=>$(x).style.display=x===s?"":"none");window.scrollTo(0,0)}
function tok(i){const a=D[i].a,s=TA[i]||[];return s.length===a.length&&a.every(x=>s.includes(x))}
function tans(i){return (TA[i]||[]).length>0}
function qhtml(i,rev){const Q=D[i],m=multi(i),s=TA[i]||[];
 let h=`<div class="meta">Întrebarea ${Q.n} din culegere · ${m?"CM · mai multe răspunsuri corecte":"CS · un singur răspuns corect"}</div><div class="q">${Q.q}</div>`;
 if(Q.i)h+=`<img class="zi" src="${IM[Q.i]}" style="width:${Q.w}px" alt="Imagine la întrebarea ${Q.n}">`;
 Q.o.forEach((t,k)=>{const on=s.includes(k),r=Q.a.includes(k);let c="o";
  if(rev){if(on&&r)c+=" ok";else if(on)c+=" no";else if(r)c+=" miss"}
  h+=`<label class="${c}"><input type="${m?"checkbox":"radio"}" name="t${i}" ${on?"checked":""} ${rev?"disabled":""} data-k="${k}"><span><b>${L2[k]})</b> ${t}</span></label>`});
 if(rev){h+=`<div class="note">Răspuns corect: <b>${Q.a.map(k=>L2[k]).join(", ")}</b></div>`;if(Q.note)h+=`<div class="note">${Q.note}</div>`}
 return h}
function zoomWire(){document.querySelectorAll("#test .zi").forEach(im=>{im.onclick=()=>{$("lbi").src=im.src;$("lb").style.display="flex"}})}
function startTest(){TQ=shuffle(D.map((_,i)=>i)).slice(0,30);TA={};tp=0;td=false;tf="";scr("test");trender()}
function trender(){
 if(td)return tres();
 const i=TQ[tp],n=TQ.filter(tans).length,m=multi(i);
 $("test").innerHTML=`<h1 style="display:flex;justify-content:space-between;align-items:center">Mod test <button id="tmenu" style="font-size:14px;font-weight:400">☰ Meniu</button></h1>
 <div class="pb"><i style="width:${n/TQ.length*100}%"></i></div><div class="sc" style="margin-bottom:10px">Întrebarea ${tp+1}/${TQ.length} · ${n} răspunse · fără verificare până la final</div>
 <div class="card">${qhtml(i,false)}</div>
 <div class="nav"><button id="tprev" ${tp===0?"disabled":""}>← Înapoi</button><button id="tfin" class="p">Termină testul</button><span class="sp"></span><button id="tnext" ${tp>=TQ.length-1?"disabled":""}>Înainte →</button></div>
 <div class="grid" style="margin-top:18px">${TQ.map((x,p)=>`<button data-p="${p}" class="${p===tp?"cur ":""}${tans(x)?"s":""}">${p+1}</button>`).join("")}</div>`;
 $("test").querySelectorAll(".card input").forEach(el=>el.onchange=()=>{const k=+el.dataset.k;let s=TA[i]||[];
  s=m?(el.checked?[...new Set([...s,k])]:s.filter(x=>x!==k)):[k];TA[i]=s;trender()});
 $("test").querySelectorAll(".grid button").forEach(b=>b.onclick=()=>{tp=+b.dataset.p;trender()});
 $("tprev").onclick=()=>{if(tp>0){tp--;trender();window.scrollTo(0,0)}};
 $("tnext").onclick=()=>{if(tp<TQ.length-1){tp++;trender();window.scrollTo(0,0)}};
 $("tmenu").onclick=()=>scr("home");
 $("tfin").onclick=()=>{const un=TQ.filter(x=>!tans(x)).length,now=Date.now(),b=$("tfin");
  if(un&&now-tarm>4000){tarm=now;b.textContent=`${un} fără răspuns · apasă din nou`;setTimeout(()=>{if(!td&&$("tfin"))$("tfin").textContent="Termină testul"},4000);return}
  td=true;tf="";tres();window.scrollTo(0,0)};
 zoomWire()}
function tres(){
 const N=TQ.length,r=TQ.filter(tok).length,un=TQ.filter(x=>!tans(x)).length,w=N-r-un,p=Math.round(r/N*100);
 let h=`<h1 style="display:flex;justify-content:space-between;align-items:center">Rezultat <button id="tmenu" style="font-size:14px;font-weight:400">☰ Meniu</button></h1>
 <div class="card" style="text-align:center"><div style="font-size:48px;font-weight:700">${p}%</div><div>${r} corecte din ${N}</div><div class="sc">${w} greșite · ${un} fără răspuns</div></div>
 <div class="bar" style="margin-top:14px"><button data-f="" class="${tf===""?"p":""}">Toate (${N})</button><button data-f="w" class="${tf==="w"?"p":""}">Greșite (${N-r})</button><button data-f="c" class="${tf==="c"?"p":""}">Corecte (${r})</button><span class="sp"></span><button id="tnew" class="p">Test nou</button></div>`;
 TQ.forEach((i,p)=>{const o=tok(i);if(tf==="w"&&o)return;if(tf==="c"&&!o)return;
  h+=`<div class="card" style="margin-bottom:12px"><div class="fb ${o?"g":"r"}" style="margin:0 0 10px"><b>${p+1}. ${o?"Corect":(tans(i)?"Greșit":"Fără răspuns")}</b></div>${qhtml(i,true)}</div>`});
 $("test").innerHTML=h;
 $("test").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{tf=b.dataset.f;tres()});
 $("tnew").onclick=startTest;$("tmenu").onclick=()=>scr("home");zoomWire()}
$("goall").onclick=()=>scr("app");$("gotest").onclick=startTest;$("menu").onclick=()=>scr("home");
filt();
</script></body></html>
